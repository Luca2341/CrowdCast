<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Inter;
    background:radial-gradient(circle at top,#0a1430,#040814);
    color:white;
}

/* LOGIN SCREEN */
#authScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
    z-index:9999;
}

.authBox{
    background:rgba(255,255,255,0.05);
    padding:25px;
    border-radius:14px;
    width:300px;
    backdrop-filter:blur(12px);
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    color:white;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(10,15,30,0.6);
    backdrop-filter:blur(12px);
}

.logo{
    font-weight:900;
    font-size:20px;
}
.logo span{color:#15a8ff}

/* BUTTONS */
button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.primary{
    background:#15a8ff;
    color:white;
}

/* STREAMS */
.container{
    padding:20px;
}

#streams{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
}

.card{
    background:rgba(255,255,255,0.04);
    padding:15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
}

/* VIDEO */
video{
    width:100%;
    border-radius:12px;
    margin-top:10px;
}

#streamView{
    padding:20px;
}

/* CHAT */
#chatBox{
    height:150px;
    overflow:auto;
    margin-top:10px;
    background:rgba(255,255,255,0.03);
    padding:10px;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authScreen">
  <div class="authBox">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Passwort">
    <button class="primary" onclick="login()">Login</button>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="logo">Crowd<span>Cast</span></div>
  <button class="primary" onclick="loadStreams()">Reload</button>
</div>

<!-- STREAM LIST -->
<div class="container">
  <h2>🔥 Live Streams</h2>
  <div id="streams"></div>
</div>

<script>

/* =======================
   SUPABASE SETUP
======================= */

const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";
const client = supabase.createClient(supabaseUrl, supabaseKey);

/* =======================
   LOGIN
======================= */

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const {error} = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("authScreen").style.display = "none";
  loadStreams();
}

/* =======================
   STREAM LIST
======================= */

async function loadStreams(){

  const {data} = await client.from("streams").select("*");

  const box = document.getElementById("streams");
  box.innerHTML = "";

  data.forEach(s=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${s.title}</h3>
      <p>${s.category}</p>
      <button class="primary" onclick="watchStream('${s.title}')">
        Watch
      </button>
    `;

    box.appendChild(div);

  });
}

/* =======================
   WATCH STREAM
======================= */

async function watchStream(title){

  document.body.innerHTML = `
    <div id="streamView">
      <h2>${title}</h2>

      <video id="video" autoplay controls></video>

      <div id="chatBox"></div>

      <input id="msg" placeholder="Nachricht">
      <button class="primary" onclick="sendMsg()">Send</button>
    </div>
  `;

}

async function sendMsg(){

  const msg = document.getElementById("msg").value;

  await client.from("messages").insert([{
    room:"global",
    text:msg
  }]);

}

/* INIT */
loadStreams();

</script>

</body>
</html>
