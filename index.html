<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:#0b0f1a;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#0f172a;
  padding:20px;
  position:fixed;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.logo{
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
}

.nav-item{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  color:#cbd5e1;
}

.nav-item:hover{
  background:#1e293b;
}

/* MAIN */
.main{
  margin-left:240px;
  width:100%;
  padding:30px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#15a8ff;
  color:white;
}

/* PAGES */
.page{
  display:none;
}

.active{
  display:block;
}

/* STREAM CARD */
.card{
  background:#111827;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid rgba(255,255,255,0.06);
}

/* BADGE */
.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  background:#ff2d55;
}

/* LOGIN */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#111827;
  padding:20px;
  border-radius:12px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">CrowdCast</div>

  <div class="nav-item" onclick="showPage('home')">🏠 Home</div>
  <div class="nav-item" onclick="showPage('streams')">🔴 Live</div>
  <div class="nav-item" onclick="showPage('create')">🎥 Go Live</div>
  <div class="nav-item" onclick="openLogin()">👤 Login</div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h2 id="title">Home</h2>
    <button class="primary" onclick="logout()">Logout</button>
  </div>

  <!-- HOME -->
  <div id="home" class="page active">
    <h1>Willkommen bei CrowdCast 🎥</h1>
    <p>Live Stadion Streams von echten Fans.</p>
  </div>

  <!-- STREAMS -->
  <div id="streams" class="page">
    <h2>Live Streams 🔴</h2>
    <div id="streamsContainer"></div>
  </div>

  <!-- CREATE -->
  <div id="create" class="page">
    <h2>Go Live 🎥</h2>
    <button class="primary" onclick="createStream()">Stream starten</button>
  </div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Passwort">

    <button class="primary" onclick="signIn()">Login</button>
    <button onclick="signUp()">Register</button>
    <button onclick="closeLogin()">Close</button>
  </div>
</div>

<script>

/* SUPABASE */
const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

/* NAVIGATION */
function showPage(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.getElementById('title').innerText = page.toUpperCase();

  if(page === "streams"){
    loadStreams();
  }
}

/* LOGIN */
function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

/* AUTH */
async function signIn(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email, password
  });

  if(error) alert(error.message);
  else closeLogin();
}

async function signUp(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({
    email, password
  });

  if(error) alert(error.message);
  else alert("Account erstellt 🚀");
}

async function logout(){
  await supabaseClient.auth.signOut();
}

/* STREAMS */
async function createStream(){
  const title = prompt("Stream Titel:");
  const description = prompt("Beschreibung:");

  const { data: user } = await supabaseClient.auth.getUser();

  if(!user.user){
    alert("Bitte einloggen");
    return;
  }

  await supabaseClient.from("streams").insert([
    {
      title,
      description,
      user_id: user.user.id,
      is_live: true
    }
  ]);

  loadStreams();
}

async function loadStreams(){

  const { data } = await supabaseClient
    .from("streams")
    .select("*")
    .order("created_at",{ascending:false});

  const container = document.getElementById("streamsContainer");
  container.innerHTML = "";

  data.forEach(stream => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div>
        <h3>${stream.title}</h3>
        <p style="color:#94a3b8">${stream.description || ""}</p>
      </div>

      <div class="badge">
        ${stream.is_live ? "LIVE 🔴" : "OFFLINE"}
      </div>
    `;

    container.appendChild(card);
  });
}

</script>

</body>
</html>
