<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:#070b18;
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:#0f172a;
  position:sticky;
  top:0;
}

.logo{
  font-weight:900;
}
.logo span{color:#15a8ff}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:#15a8ff;color:white}
.ghost{background:#1e293b;color:white}

/* HERO */
.hero{
  padding:30px 20px;
}

.hero h1{
  font-size:34px;
  font-weight:900;
}

.hero p{
  color:#9fb3d1;
  margin-top:10px;
}

/* STREAMS */
.section{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:15px;
}

.card{
  background:#111a2e;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

/* STREAM VIEW */
#streamView{
  display:none;
  padding:20px;
}

video{
  width:100%;
  max-width:700px;
  border-radius:12px;
}

.chat{
  margin-top:15px;
  background:#111a2e;
  padding:10px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:#0a0f1d;
  color:white;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">Crowd<span>Cast</span></div>
  <button class="primary" onclick="alert('Go Live kommt später')">Go Live</button>
</nav>

<!-- HOME -->
<div id="home">

<div class="hero">
  <h1>Live Sport. Aus der Crowd.</h1>
  <p>Streams direkt aus dem Stadion – echte Fan-Perspektive.</p>

  <button class="primary" onclick="scrollToStreams()">Streams ansehen</button>
</div>

<div class="section" id="streamsSection">
  <h2>🔥 Live Streams</h2>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d">
      <div class="card-content">
        <b>Champions League</b><br><br>
        <button class="primary" onclick="openStream('Champions League')">Watch</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2">
      <div class="card-content">
        <b>NBA Finals</b><br><br>
        <button class="primary" onclick="openStream('NBA Finals')">Watch</button>
      </div>
    </div>

  </div>
</div>

</div>

<!-- STREAM VIEW -->
<div id="streamView">

<button class="ghost" onclick="back()">← Back</button>

<h2 id="title"></h2>

<video controls autoplay></video>

<div class="chat">
  <div id="chatBox"></div>
  <input id="msg" placeholder="Nachricht...">
  <button class="primary" onclick="sendMsg()">Send</button>
</div>

</div>

<script>

function scrollToStreams(){
  document.getElementById("streamsSection").scrollIntoView({behavior:"smooth"});
}

function openStream(title){

  document.getElementById("home").style.display="none";
  document.getElementById("streamView").style.display="block";

  document.getElementById("title").innerText = title;
}

function back(){
  document.getElementById("home").style.display="block";
  document.getElementById("streamView").style.display="none";
}

function sendMsg(){

  const msg=document.getElementById("msg").value;
  if(!msg) return;

  const div=document.createElement("div");
  div.innerText=msg;

  document.getElementById("chatBox").appendChild(div);

  document.getElementById("msg").value="";
}

</script>

</body>
</html>
