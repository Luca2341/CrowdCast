<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter;
  background:#050814;
  color:white;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:#0f172a;
  position:sticky;
  top:0;
}

.logo{font-weight:900}
.logo span{color:#15a8ff}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.primary{background:#15a8ff;color:white}
.ghost{background:#1e293b;color:white}

.container{padding:20px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:12px;
}

.card{
  background:#111a2e;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

video{
  width:100%;
  max-width:700px;
  border-radius:12px;
}

.chat{
  margin-top:10px;
  background:#111a2e;
  padding:10px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:#0a0f1d;
  color:white;
}

#streamView{display:none}

</style>
</head>

<body>

<nav>
<div class="logo">Crowd<span>Cast</span></div>
<div>
<button class="ghost" onclick="login()">Login</button>
<button class="primary" onclick="goLive()">Go Live</button>
</div>
</nav>

<!-- HOME -->
<div class="container" id="home">

<h2>🔥 Live Streams</h2>
<div class="grid" id="streams"></div>

</div>

<!-- STREAM VIEW -->
<div class="container" id="streamView">

<button class="ghost" onclick="back()">← Back</button>

<h2 id="title"></h2>

<video id="video" autoplay playsinline controls></video>

<div class="chat">
<div id="chatBox"></div>
<input id="msg" placeholder="Nachricht...">
<button class="primary" onclick="sendMsg()">Send</button>
</div>

</div>

<script>

/* =======================
   SUPABASE INIT
======================= */

const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

/* =======================
   STATE
======================= */

let pc;
let room;

/* =======================
   LOGIN
======================= */

async function login(){

  const email = prompt("Email");
  const pass = prompt("Passwort");

  const {data,error} = await supabase.auth.signInWithPassword({
    email,
    password:pass
  });

  if(error) alert(error.message);
  else alert("Login erfolgreich");

}

/* =======================
   LOAD STREAMS
======================= */

async function loadStreams(){

  const {data} = await supabase
    .from("streams")
    .select("*");

  const box = document.getElementById("streams");
  box.innerHTML = "";

  data.forEach(s=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${s.title}</b><br><br>
      <button class="primary" onclick="join('${s.title}')">Watch</button>
    `;

    box.appendChild(div);

  });

}

/* =======================
   JOIN STREAM (VIEWER)
======================= */

async function join(title){

  room = title;

  document.getElementById("home").style.display = "none";
  document.getElementById("streamView").style.display = "block";

  document.getElementById("title").innerText = title;

  pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.ontrack = (e)=>{
    document.getElementById("video").srcObject = e.streams[0];
  };

  listenSignals();

}

/* =======================
   GO LIVE (STREAMER)
======================= */

async function goLive(){

  room = prompt("Stream Name");

  const stream = await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
  });

  pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  stream.getTracks().forEach(t=>pc.addTrack(t,stream));

  pc.onicecandidate = async (e)=>{
    if(e.candidate){
      await supabase.from("messages").insert([{
        room,
        text: JSON.stringify(e.candidate)
      }]);
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await supabase.from("messages").insert([{
    room,
    text: JSON.stringify(offer)
  }]);

  alert("Live gestartet");

}

/* =======================
   SIGNALING
======================= */

function listenSignals(){

  supabase.channel("live")
  .on("postgres_changes",{
    event:"INSERT",
    schema:"public",
    table:"messages"
  }, async p=>{

    if(p.new.room !== room) return;

    const data = JSON.parse(p.new.text);

    try{

      if(data.type === "offer"){
        await pc.setRemoteDescription(data);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await supabase.from("messages").insert([{
          room,
          text: JSON.stringify(answer)
        }]);
      }

      if(data.type === "answer"){
        await pc.setRemoteDescription(data);
      }

      if(data.candidate){
        await pc.addIceCandidate(data);
      }

    }catch(e){}

  }).subscribe();

}

/* =======================
   CHAT
======================= */

async function sendMsg(){

  const msg = document.getElementById("msg").value;

  await supabase.from("messages").insert([{
    room,
    text: msg
  }]);

}

/* LIVE CHAT */
supabase.channel("chat")
.on("postgres_changes",{
  event:"INSERT",
  schema:"public",
  table:"messages"
},p=>{

  if(p.new.room !== room) return;

  const div = document.createElement("div");
  div.innerText = p.new.text;

  document.getElementById("chatBox").appendChild(div);

}).subscribe();

/* =======================
   BACK
======================= */

function back(){
  location.reload();
}

/* INIT */
loadStreams();

</script>

</body>
</html>
