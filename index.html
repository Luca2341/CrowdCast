<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Inter;
    background:#040814;
    color:white;
}

.nav{
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:rgba(10,15,30,0.8);
    position:sticky;
    top:0;
}

.logo{font-weight:900}
.logo span{color:#15a8ff}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.primary{background:#15a8ff;color:white}
.ghost{background:#1e293b;color:white}

.container{padding:20px}

.card{
    background:#111a2e;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

input{
    padding:10px;
    border-radius:10px;
    border:none;
    width:100%;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="nav">
<div class="logo">Crowd<span>Cast</span></div>

<div>
<button class="ghost" onclick="login()">Login</button>
<button class="primary" onclick="createStream()">Go Live</button>
</div>
</div>

<div class="container">

<h2>🔥 Live Streams</h2>
<div id="streams"></div>

</div>

<script>

/* ======================
   SUPABASE SETUP
====================== */

const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";
const client = supabase.createClient(supabaseUrl, supabaseKey);

/* ======================
   LOGIN
====================== */

window.login = async function(){

  const email = prompt("Email");
  const password = prompt("Passwort");

  const {error} = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
  } else {
    alert("Login erfolgreich");
    loadStreams();
  }
}

/* ======================
   STREAMS LADEN
====================== */

async function loadStreams(){

  const {data, error} = await client
    .from("streams")
    .select("*");

  const box = document.getElementById("streams");
  box.innerHTML = "";

  if(error){
    box.innerHTML = "Fehler beim Laden";
    return;
  }

  data.forEach(s => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${s.title}</b><br><br>
      <button class="primary" onclick="watchStream('${s.title}')">Watch</button>
    `;

    box.appendChild(div);
  });

}

/* ======================
   STREAM ERSTELLEN
====================== */

window.createStream = async function(){

  const title = prompt("Stream Name");

  const {data:{user}} = await client.auth.getUser();

  if(!user){
    alert("Bitte einloggen");
    return;
  }

  const {error} = await client
    .from("streams")
    .insert([{
      title,
      user_id: user.id,
      is_live: true
    }]);

  if(error){
    alert(error.message);
  } else {
    alert("Stream erstellt");
    loadStreams();
  }
}

/* ======================
   STREAM VIEW
====================== */

window.watchStream = function(title){
  alert("Opening stream: " + title);
}

/* INIT */
loadStreams();

</script>

</body>
</html>
