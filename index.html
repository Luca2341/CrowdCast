<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrowdCast</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
}

/* TOP BAR */
.top{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* LAYOUT */
.container{
  padding:20px;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  margin:5px 0;
  width:200px;
}

video{
  width:100%;
  max-width:600px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="top">
  <b>CrowdCast</b>
  <div>
    <button onclick="mode='viewer'">👀 Watch</button>
    <button onclick="mode='streamer'">🎥 Go Live</button>
  </div>
</div>

<div class="container">

<!-- STREAMER -->
<div id="streamerBox" class="card" style="display:none;">
  <h2>🎥 Stream starten</h2>

  <input id="room" placeholder="Room Name">
  <br>

  <video id="localVideo" autoplay muted></video>
  <br><br>

  <button onclick="startStream()">Start</button>
</div>

<!-- VIEWER -->
<div id="viewerBox" class="card" style="display:none;">
  <h2>👀 Stream ansehen</h2>

  <input id="viewRoom" placeholder="Room Name">
  <br><br>

  <button onclick="startView()">Join</button>

  <br><br>
  <video id="remoteVideo" autoplay></video>
</div>

</div>

<script>

const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let mode = "viewer";
let pc;
let stream;

/* UI SWITCH */
setInterval(()=>{
  document.getElementById("streamerBox").style.display = mode==="streamer"?"block":"none";
  document.getElementById("viewerBox").style.display = mode==="viewer"?"block":"none";
},100);

/* =======================
   STREAMER
======================= */
async function startStream(){

  const room = document.getElementById("room").value;

  stream = await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
  });

  document.getElementById("localVideo").srcObject = stream;

  pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  stream.getTracks().forEach(t=>pc.addTrack(t,stream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await supabase.from("signals").insert([{
    room,
    sender:"streamer",
    data:offer
  }]);

  pc.onicecandidate = async (e)=>{
    if(e.candidate){
      await supabase.from("signals").insert([{
        room,
        sender:"streamer",
        data:e.candidate
      }]);
    }
  };

  alert("Live gestartet 🔴");
}

/* =======================
   VIEWER
======================= */
async function startView(){

  const room = document.getElementById("viewRoom").value;

  pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.ontrack = (e)=>{
    document.getElementById("remoteVideo").srcObject = e.streams[0];
  };

  pc.onicecandidate = async (e)=>{
    if(e.candidate){
      await supabase.from("signals").insert([{
        room,
        sender:"viewer",
        data:e.candidate
      }]);
    }
  };

  let {data} = await supabase
    .from("signals")
    .select("*")
    .eq("room",room)
    .eq("sender","streamer")
    .limit(1);

  if(!data.length){
    alert("Kein Stream aktiv");
    return;
  }

  await pc.setRemoteDescription(new RTCSessionDescription(data[0].data));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await supabase.from("signals").insert([{
    room,
    sender:"viewer",
    data:answer
  }]);

  alert("Verbunden 👀");
}

</script>

</body>
</html>
