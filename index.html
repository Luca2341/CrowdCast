<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CrowdCast</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, Arial;
    }

    body {
      background: #0b0f1a;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      background: #111827;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #0072ff;
      color: white;
      cursor: pointer;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .hidden {
      display: none;
    }

    .dashboard {
      padding: 40px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }

    input {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">CrowdCast</div>

  <div>
    <button onclick="openLogin()" id="loginBtn">Login</button>
    <button onclick="logout()" id="logoutBtn" class="hidden">Logout</button>
  </div>
</header>

<section class="hero" id="home">
  <h1>Live Sports Plattform</h1>
  <p>Streams, Community & AI Features (Coming Soon)</p>
</section>

<section class="dashboard hidden" id="dashboard">
  <h2>Dashboard</h2>

  <div class="card">
    Du bist eingeloggt 🚀
  </div>

  <div class="card">
    Hier kommen später Streams, KI Highlights und Premium Features.
  </div>
</section>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>

    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Passwort" />

    <button onclick="signUp()">Registrieren</button>
    <button onclick="signIn()">Einloggen</button>
    <button onclick="closeLogin()">Schließen</button>
  </div>
</div>

<script>
const supabaseUrl = "https://ujtzhllmkclhibybfhae.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHpobGxta2NsaGlieWJmaGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU2NDQsImV4cCI6MjA5NDE2MTY0NH0.3hAL7y3QgnYLZEL3lSx2Dn9ssWkukdOvPFRej-RhYH8";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// LOGIN UI
function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

// REGISTER
async function signUp(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({ email, password });

  if(error){
    alert(error.message);
  } else {
    alert("Account erstellt!");
  }
}

// LOGIN
async function signIn(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
  } else {
    updateUI();
    closeLogin();
  }
}

// LOGOUT
async function logout(){
  await supabaseClient.auth.signOut();
  updateUI();
}

// UI SWITCH
async function updateUI(){
  const { data } = await supabaseClient.auth.getUser();

  if(data.user){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    document.getElementById("loginBtn").classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");
  } else {
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");

    document.getElementById("loginBtn").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
  }
}

updateUI();
</script>

</body>
</html>
